name: Build AdShield-Rootless

on:
  push:
    branches: [ main ]
    paths:
      - 'AdShield-Rootless/**'
      - '.github/workflows/adshield-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and patched SDK
        run: |
          brew install make ldid xz
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$HOME/theos/sdks"

      - name: Build rootless package
        working-directory: AdShield-Rootless
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: AdShield-Rootless-v1.0.0
          path: AdShield-Rootless/packages/*.deb
